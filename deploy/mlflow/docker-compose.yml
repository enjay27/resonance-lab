# MLflow tracking server for resonance-lab, on the Synology NAS (Container Manager -> Project, or `docker compose up -d`).
# One user, LAN only, metadata and small files (reports, predictions), no user code. See README.md.
# Records: the Postgres of deploy/postgres/ (start that project first). Small files: the NAS's MinIO.
# Settings and secrets come from `.env` next to this file (copy `.env.example`); `.env` is gitignored.
name: resonance-mlflow

services:
  mlflow:
    build:
      context: .
      args:
        MLFLOW_VERSION: ${MLFLOW_VERSION:?set MLFLOW_VERSION in .env}
    image: resonance-mlflow:${MLFLOW_VERSION}
    container_name: resonance-mlflow
    restart: unless-stopped

    # Reachable on the LAN address you set, on 5050 (DSM itself uses 5000); never on every interface.
    ports:
      - "${MLFLOW_BIND:?set MLFLOW_BIND in .env to the NAS LAN IP}:${MLFLOW_PORT:-5050}:5050"

    # The server only tracks runs. Nothing here executes code that a client sends.
    command:
      - server
      - --host
      - 0.0.0.0
      - --port
      - "5050"
      - --workers
      - "1" # one user, a 2-core NAS
      - --backend-store-uri
      - postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in .env}@postgres:5432/mlflow
      - --serve-artifacts # small files go through the server: the desktop needs no access to MinIO
      - --artifacts-destination
      - s3://${MINIO_BUCKET:?set MINIO_BUCKET in .env}/artifacts
      - --app-name
      - basic-auth # one admin user; users cannot sign themselves up
      - --allowed-hosts # a request must name one of these hosts (the NAS address and port you use)
      - "${MLFLOW_ALLOWED_HOSTS:?set MLFLOW_ALLOWED_HOSTS in .env},localhost:5050,127.0.0.1:5050"
      - --cors-allowed-origins # only the web UI's own address (the browser sends it as the Origin of the UI's requests); no other site
      - "http://${MLFLOW_BIND}:${MLFLOW_PORT:-5050}"

    environment:
      # basic-auth's own database (users and permissions), the second database of deploy/postgres/. entrypoint.py renders
      # it into the auth config; MLflow reads that URI only from a file.
      MLFLOW_AUTH_DB_URI: postgresql+psycopg2://mlflow:${MLFLOW_DB_PASSWORD:?set MLFLOW_DB_PASSWORD in .env}@postgres:5432/mlflow_auth
      MLFLOW_S3_ENDPOINT_URL: ${MINIO_ENDPOINT_URL:?set MINIO_ENDPOINT_URL in .env}
      AWS_ACCESS_KEY_ID: ${MINIO_ACCESS_KEY:?set MINIO_ACCESS_KEY in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_SECRET_KEY:?set MINIO_SECRET_KEY in .env}
      AWS_DEFAULT_REGION: us-east-1 # boto3 wants one; MinIO ignores it
      MLFLOW_AUTH_ADMIN_PASSWORD: ${MLFLOW_AUTH_ADMIN_PASSWORD:?set MLFLOW_AUTH_ADMIN_PASSWORD in .env}
      MLFLOW_FLASK_SERVER_SECRET_KEY: ${MLFLOW_FLASK_SERVER_SECRET_KEY:?set MLFLOW_FLASK_SERVER_SECRET_KEY in .env}
      # MLflow 3.x starts job workers by default: processes that execute job functions. Off: this server runs no code.
      MLFLOW_SERVER_ENABLE_JOB_EXECUTION: "false"
      MLFLOW_SERVER_JOB_ENABLE_PERIODIC_TASKS: "false"
      MLFLOW_ENABLE_REMOTE_ASSISTANT: "false"
      MLFLOW_ENABLE_ASSISTANT_SANDBOX: "false"
      MLFLOW_DISABLE_TELEMETRY: "true"
      DO_NOT_TRACK: "true"
      MLFLOW_DISABLE_AGENT_HINT: "1"
      HOME: /tmp

    # Reaches Postgres (container `postgres`) over the private network that deploy/postgres/ creates.
    networks:
      - resonance-db

    # Locked down: nobody (no data files to own any more), a read-only root file system, no capabilities, no docker socket.
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /tmp
    working_dir: /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 200

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5050/health', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

networks:
  resonance-db:
    name: resonance-db
    external: true # created by deploy/postgres/ (`docker compose up` there first)
