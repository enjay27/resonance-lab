# MLflow basic-auth settings (read via MLFLOW_AUTH_CONFIG_PATH). No secret in this file: the admin password comes
# from MLFLOW_AUTH_ADMIN_PASSWORD (.env), which MLflow uses once, when it creates the admin user in an empty store.
[mlflow]
# MLflow's own default is READ, which would let any new user read every experiment. Only the admin, i.e. you.
default_permission = NO_PERMISSIONS
database_uri = sqlite:////data/basic_auth.db
admin_username = admin
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
