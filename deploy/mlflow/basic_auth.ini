# MLflow basic-auth settings, a template: deploy/mlflow/entrypoint.py renders it to /tmp at container start.
# No secret in this file: the database URI (it holds the Postgres password) comes from MLFLOW_AUTH_DB_URI (.env) and
# replaces the placeholder below; the admin password comes from MLFLOW_AUTH_ADMIN_PASSWORD, which MLflow uses once,
# when it creates the admin user in an empty store.
[mlflow]
# MLflow's own default is READ, which would let any new user read every experiment. Only the admin, i.e. you.
default_permission = NO_PERMISSIONS
database_uri = @AUTH_DB_URI@
admin_username = admin
authorization_function = mlflow.server.auth:authenticate_request_basic_auth
