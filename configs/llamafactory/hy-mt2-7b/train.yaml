### Model (Tencent Hy-MT2; recipe from its train/llama_factory_support, adapted to this pipeline)
model_name_or_path: tencent/Hy-MT2-7B
trust_remote_code: true

### Training Method
stage: sft
do_train: true
finetuning_type: lora

### LoRA (Tencent's defaults)
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj

### Dataset
dataset: bp_translation
template: hy_dense_7b
cutoff_len: 256
val_size: 0.05

### Training
learning_rate: 2.0e-4
num_train_epochs: 3.0
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
flash_attn: fa2
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
gradient_checkpointing: true
dataloader_num_workers: 0
max_grad_norm: 1.0

### Precision
bf16: true

### Eval & Save
eval_strategy: steps
eval_steps: 100
save_strategy: steps
save_steps: 100
save_total_limit: 3
load_best_model_at_end: true

### Output
output_dir: outputs/hy-mt2-7b_lora
logging_steps: 1
plot_loss: true
