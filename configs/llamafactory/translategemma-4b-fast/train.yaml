### Model
model_name_or_path: google/translategemma-4b-it
trust_remote_code: true

### Training Method
stage: sft
do_train: true
finetuning_type: lora

### LoRA
lora_rank: 32
lora_alpha: 32
lora_dropout: 0.05
lora_target: q_proj,v_proj,gate_proj,down_proj

### Dataset
dataset: bp_translation
template: gemma3
cutoff_len: 256
eval_dataset: bp_translation_val  # preprocess.py --format pair writes it: a split by line (valsplit.py), not LLaMA-Factory's random val_size

### Training (speed profile: same recipe as translategemma-4b, throughput settings changed)
# Packing joins short chat lines into full sequences instead of padding them; Liger fuses the loss/norm kernels.
packing: true
enable_liger_kernel: true
learning_rate: 1.0e-5
num_train_epochs: 3.0
per_device_train_batch_size: 16
gradient_accumulation_steps: 2
flash_attn: auto  # fa2 if it is installed, else sdpa; with fa2 working, add `neat_packing: true`
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
gradient_checkpointing: false
dataloader_num_workers: 0
max_grad_norm: 1.0

### Precision
bf16: true

### Eval & Save
eval_strategy: steps
eval_steps: 100
save_strategy: steps
save_steps: 100
save_total_limit: 3
load_best_model_at_end: true

### Output
output_dir: outputs/translategemma-fast_lora
logging_steps: 1
plot_loss: true