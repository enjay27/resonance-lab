### Model (Tencent Hy-MT2; recipe from its train/llama_factory_support, adapted to this pipeline)
model_name_or_path: tencent/Hy-MT2-7B
trust_remote_code: true

### Training Method
stage: sft
do_train: true
finetuning_type: lora

### LoRA (Tencent's defaults)
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05
lora_target: q_proj,k_proj,v_proj,o_proj

### Dataset
dataset: bp_translation
template: hy_dense_7b
cutoff_len: 256
eval_dataset: bp_translation_val  # preprocess.py --format pair writes it: a split by line (valsplit.py), not LLaMA-Factory's random val_size

### Training (speed profile: same recipe as hy-mt2-7b, throughput settings changed)
# Packing joins short chat lines into full sequences instead of padding them; Liger fuses the loss/norm kernels.
packing: true
enable_liger_kernel: true
learning_rate: 2.0e-4
num_train_epochs: 3.0
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
flash_attn: auto  # fa2 if it is installed, else sdpa; with fa2 working, add `neat_packing: true`
lr_scheduler_type: cosine
warmup_ratio: 0.1
weight_decay: 0.01
gradient_checkpointing: true
dataloader_num_workers: 0
max_grad_norm: 1.0

### Precision
bf16: true

### Eval & Save
eval_strategy: steps
eval_steps: 100
save_strategy: steps
save_steps: 100
save_total_limit: 3
load_best_model_at_end: true

### Output
output_dir: outputs/hy-mt2-7b-fast_lora
logging_steps: 1
plot_loss: true
